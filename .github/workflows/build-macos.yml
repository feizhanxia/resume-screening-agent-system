name: Build and release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release tag and source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" && "$GITHUB_REF_NAME" != v$VERSION-* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Install Python 3.12 ARM64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build, test and smoke-test macOS artifacts
        shell: bash
        run: ./deploy/build_macos.sh

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resume-screening-agent-macos-arm64
          path: |
            dist/ResumeScreeningAgent-macOS-arm64.dmg
            dist/ResumeScreeningAgent-macOS-arm64.zip
            dist/macos-SHA256.txt
            dist/macos-dependencies.txt
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attest macOS release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/ResumeScreeningAgent-macOS-arm64.dmg
            dist/ResumeScreeningAgent-macOS-arm64.zip

      - name: Add macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..90}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "90" ]]; then
              echo "Windows workflow did not create the Release in time." >&2
              exit 1
            fi
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "dist/ResumeScreeningAgent-macOS-arm64.dmg#macOS Apple Silicon DMG" \
            "dist/ResumeScreeningAgent-macOS-arm64.zip#macOS Apple Silicon APP" \
            "dist/macos-SHA256.txt#macOS SHA-256 checksums" \
            "dist/macos-dependencies.txt#macOS build dependencies"
