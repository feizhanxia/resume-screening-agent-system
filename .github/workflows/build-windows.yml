name: Build and release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release tag and source
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit on main."
          }
          $Version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          if (($env:GITHUB_REF_NAME -ne "v$Version") -and
              (-not $env:GITHUB_REF_NAME.StartsWith("v$Version-"))) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $Version."
          }

      - name: Install Python 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build, test and smoke-test Windows artifacts
        shell: powershell
        run: ./deploy/build_windows.ps1 -RequireInstaller

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resume-screening-agent-windows-x64
          path: |
            dist/ResumeScreeningAgent-Setup-x64.exe
            dist/ResumeScreeningAgent-portable-x64.zip
            dist/windows-SHA256.txt
            dist/windows-dependencies.txt
            docs/简历筛选工作台-Windows版使用手册.docx
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attest release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/ResumeScreeningAgent-Setup-x64.exe
            dist/ResumeScreeningAgent-portable-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $Arguments = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "dist/ResumeScreeningAgent-Setup-x64.exe#Windows x64 安装版",
            "dist/ResumeScreeningAgent-portable-x64.zip#Windows x64 免安装版",
            "dist/windows-SHA256.txt#SHA-256 校验值",
            "dist/windows-dependencies.txt#构建依赖清单",
            "docs/简历筛选工作台-Windows版使用手册.docx#Windows 图文手册",
            "LICENSE#MIT License",
            "THIRD_PARTY_NOTICES.md#第三方组件说明",
            "--title", "简历筛选工作台 $env:GITHUB_REF_NAME",
            "--notes-file", ".github/release-notes.md"
          )
          if ($env:GITHUB_REF_NAME.Contains("-")) {
            $Arguments += "--prerelease"
          }
          gh @Arguments
